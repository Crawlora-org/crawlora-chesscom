[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-chesscom"
version = "0.1.1"
description = "Crawlora Chess.com API client with 26 endpoints for puzzles, player and club resources, tournaments, and public team matches"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "chesscom", "chess-com", "chesscom-api", "chess-com-api", "chesscom-scraper", "chess-com-scraper", "chesscom-data", "chess-com-data", "chesscom-puzzles", "chesscom-player-club-resources", "chesscom-tournaments", "chesscom-public-team-matches"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=chesscom-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=chesscom-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-chesscom"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_chesscom"]

[tool.setuptools.package-data]
"crawlora_chesscom" = ["py.typed", "*.pyi"]
